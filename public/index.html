<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>任成文美股投资组合概览</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div>
        <p class="eyebrow">Trading 212 Portfolio</p>
        <h1>任成文美股投资组合概览</h1>
      </div>
      <div class="top-meta">
        <span id="modeBadge">只读</span>
        <span id="refreshBadge">自动更新</span>
      </div>
      <div class="status">
        <span id="connectionDot" class="dot"></span>
        <span id="statusText">正在准备</span>
      </div>
    </header>

    <main class="layout">
      <section class="toolbar" aria-label="连接 Trading 212">
        <div class="field credential-field">
          <label for="apiKey">Trading 212 API key</label>
          <input id="apiKey" type="password" placeholder="粘贴只读 API key" autocomplete="off" />
        </div>
        <div class="field credential-field">
          <label for="secretKey">Secret key</label>
          <input id="secretKey" type="password" placeholder="粘贴 secret key" autocomplete="off" />
        </div>
        <button id="saveKey" type="button">连接</button>
        <span id="lastUpdated" class="muted">尚未同步</span>
      </section>

      <section class="summary-grid" aria-label="账户概览">
        <article>
          <span>账户总值</span>
          <strong id="totalValue">--</strong>
        </article>
        <article>
          <span>今日涨跌</span>
          <strong id="todayChange">--</strong>
          <small id="todayPercent">--</small>
        </article>
        <article>
          <span>总盈亏</span>
          <strong id="totalGain">--</strong>
          <small id="totalGainUsd">--</small>
        </article>
        <article>
          <span>收益率</span>
          <strong id="totalPercent">--</strong>
        </article>
      </section>

      <section class="workspace">
        <aside class="holdings-panel" aria-label="持仓列表">
          <div class="section-head">
            <h2>持仓</h2>
            <span id="holdingCount">0</span>
          </div>
          <div id="holdingsList" class="holdings-list"></div>
        </aside>

        <section class="chart-panel" aria-label="K 线图">
          <div class="chart-head">
            <div>
              <p id="selectedTicker" class="eyebrow">--</p>
              <h2 id="selectedName">选择一只股票</h2>
            </div>
            <div class="range-buttons" role="group" aria-label="K 线周期">
              <button data-range="1mo" data-interval="1d" type="button">1月</button>
              <button data-range="6mo" data-interval="1d" type="button" class="active">6月</button>
              <button data-range="1y" data-interval="1d" type="button">1年</button>
              <button data-range="5y" data-interval="1wk" type="button">5年</button>
            </div>
          </div>
          <canvas id="candleChart" width="980" height="460"></canvas>
          <div id="chartMeta" class="muted chart-meta">等待行情数据</div>
        </section>

        <section class="news-panel" aria-label="分析师与重要消息">
          <div class="section-head">
            <h2>分析师与重要消息</h2>
            <span id="newsSymbol">--</span>
          </div>
          <div id="newsList" class="news-list"></div>
        </section>
      </section>
    </main>

    <script src="/app.js" type="module"></script>
  </body>
</html>
